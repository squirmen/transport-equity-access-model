[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team-access"
version = "0.11.0"
description = "Transport Equity and Access Model: who can reach everyday needs without a car, and what would change that."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Timothy F. Welch", email = "t.welch@auckland.ac.nz" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "geopandas>=0.14",
  "shapely>=2.0",
  "h3>=4.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "openpyxl>=3.1",  # Health New Zealand's facility register is a spreadsheet
]

[project.optional-dependencies]
routing = ["r5py>=0.1.2"]
# `team pairs` reads R5's path results through parts of r5py that are not
# public, so it needs exactly this r5py, which loads R5 v7.5-r5py
# (r5-v7.5-r5py-all.jar, sha256 70c89e57f9f98dd96c9d2be5fdc00d53a133893b2620e0d8d05e3e602f34e4d5).
pairs = ["r5py==1.1.3"]
test = ["pytest>=7"]

[project.scripts]
team = "team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
