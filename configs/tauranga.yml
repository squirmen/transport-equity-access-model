# TEAM configuration for Tauranga.
#
# Inputs were prepared with scripts/add_city.py from Stats NZ's functional
# urban areas (2023) for Tauranga (Ōmokoroa included), Te Puke and Katikati.
#
# Paths under `data` are relative to the data root, set with --data-root or
# the TEAM_DATA_ROOT environment variable.

name: tauranga
region: Tauranga, Te Puke and Katikati functional urban areas

naming:
  place: Tauranga and Western Bay
  residents: Tauranga and Western Bay residents
  possessive: Tauranga and Western Bay's
  slug: tauranga
  agency: Baybus

data:
  osm: raw/tauranga/osm/tauranga_bbox.osm.pbf
  elevation: raw/tauranga/elevation/tauranga_dem_20m.tif
  gtfs: raw/tauranga/gtfs/baybus_gtfs_2026-09-26.zip
  grid: processed/tauranga/grid/tauranga_h3_r9_population.parquet
  jobs_grid: processed/tauranga/grid/tauranga_h3_r9_v2_opportunities.parquet
  schools: raw/tauranga/education/educationcounts_schools_tauranga.json
  ece: raw/tauranga/education/educationcounts_ece_tauranga.json
  census_sa1: raw/tauranga/census/statsnz_census_sa1_2023_tauranga.geojson
  census_households: raw/auckland/census/statsnz_census_households_income_vehicle_sa1_2023.json
  census_age: raw/auckland/census/statsnz_census_individual_part1_age_sa1_2023.json
  census_equity: raw/auckland/census/statsnz_census_individual_equity_sa1_2023.json
  health_facilities: raw/nz/health/facility_code_table.xlsx
  fare_table: raw/tauranga/fares/baybus_fares_western_bay_2026-09-28.json
  fare_zone_meta: raw/tauranga/fares/baybus_fare_zones.metadata.json
  fare_zones: raw/tauranga/fares/baybus_fare_zones.geojson

origins:
  # Cells with fewer residents than this are slivers left by spreading census
  # blocks over the hexagon grid.
  min_population: 0.75

routing:
  date: "2026-09-15"          # a Tuesday in school term 3
  java_home: /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
  max_memory: 14G
  max_minutes: 60
  batch_size: 2000
  speed_walking_kmh: 4.8
  speed_cycling_kmh: 15
  # Hills slow walking and cycling by Tobler's hiking function; driving is unaffected.
  elevation_cost: tobler
  # Public transport is timed in each of these. Walking, cycling and driving
  # do not depend on the clock. A window can name its own date, because a
  # Saturday cannot be modelled on the Tuesday the rest of the model uses.
  windows:
    am_peak: {start: "07:00", minutes: 120, label: Peak, when: "weekdays 7 to 9am", phrase: "in the weekday morning peak"}
    interpeak: {start: "10:00", minutes: 120, label: Off-peak, when: "weekdays 10am to midday", phrase: "off-peak on a weekday"}
    saturday: {start: "10:00", minutes: 120, date: "2026-09-19", label: Saturday, when: "Saturday 10am to midday", phrase: "on a Saturday"}
  modes:
    walk: {kind: walk, label: Walking}
    bike_low_stress: {kind: cycle, max_traffic_stress: 2, label: Cycling on low-stress routes}
    bike: {kind: cycle, max_traffic_stress: 3, label: Cycling on any bikeable street}
    pt: {kind: transit, max_walk_minutes: 15, label: Public transport}
    # The same trips for someone who walks at 3.6 km/h (1 m/s), about the pace of
    # people in their eighties (Bohannon and Williams Andrews, 2011).
    pt_slow: {kind: transit, max_walk_minutes: 15, speed_walking_kmh: 3.6, label: Public transport at a slower walking pace}
    car: {kind: car, label: Car}

# Modes that count towards an access standard. Cycling counts only on
# low-stress routes. Car times are kept for reference and never count.
standard_modes: [walk, bike_low_stress, pt]

services:
  supermarket:
    label: Supermarket
    window: interpeak
    windows: [am_peak, saturday]  # also timed at these
    standard_minutes: 20
    osm: {shop: [supermarket]}
  gp:
    label: GP or medical centre
    window: interpeak
    windows: [am_peak, saturday]  # also timed at these
    standard_minutes: 20
    osm: {amenity: [doctors, clinic], healthcare: [doctor, clinic, centre]}
  pharmacy:
    label: Pharmacy
    window: interpeak
    windows: [am_peak, saturday]  # also timed at these
    standard_minutes: 20
    osm: {amenity: [pharmacy], healthcare: [pharmacy]}
  library:
    label: Library
    window: interpeak
    windows: [saturday]  # also timed at this
    standard_minutes: 20
    osm: {amenity: [library]}
    # School and university libraries are for their own students.
    osm_exclude: {access: [private, no, customers, students]}
  bank_post:
    label: Bank or post shop
    window: interpeak
    windows: [saturday]  # also timed at this
    standard_minutes: 20
    osm: {amenity: [bank, post_office]}
  early_childhood:
    label: Early childhood service
    window: am_peak
    standard_minutes: 15
    # Home-based networks are left out: their address is the coordinator's
    # office, not anywhere a child is dropped off.
    ece_types:
      - Education & Care Service
      - Free Kindergarten
      - Playcentre
      - Te Kōhanga Reo
      - Leo o Fanau Moana Immersion
      - Leo o Fanau Moana Bilingual
  primary_school:
    label: Primary school
    window: am_peak
    standard_minutes: 15
    school_types: [Contributing, Full Primary, Composite, Composite (Year 1-10)]
  intermediate_school:
    label: Intermediate school
    window: am_peak
    standard_minutes: 20
    school_types: [Intermediate, Full Primary, Secondary (Year 7-15), Composite, Composite (Year 1-10), Restricted Composite (Yr 7-10)]
  secondary_school:
    label: Secondary school
    window: am_peak
    standard_minutes: 30
    school_types: [Secondary (Year 7-15), Secondary (Year 9-15), Secondary (Year 11-15), Composite]

# Gravity access scores, the companion to the standards measures.
gravity:
  modes: [walk, pt, bike_low_stress]
  beta_modes: [bike_low_stress]   # published as beta: no local decay curve yet
  max_minutes: 60              # the furthest any journey was routed; each curve cuts in sooner
  # Walking and public transport use the travel time distribution parameters
  # published by the NZ Transport Agency for the New Zealand accessibility
  # analysis methodology (Abley and Halden 2013, research report 512, tables
  # 13.2 and 13.4, Main Urban Area), fitted to the New Zealand Household
  # Travel Survey 2003 to 2010. Lambda there is already a per-minute
  # parameter on routed travel time, so it is used as published.
  #
  # That method fits its curves to the first 95% of surveyed travel times and
  # counts nothing beyond, so `cutoff: rr512` gives each curve its own horizon
  # of ln(20)/beta minutes rather than one number for every purpose. Public
  # transport horizons come out past an hour and are clipped to the 60 minutes
  # actually routed, so those scores are cut shorter than the method intends.
  #
  # Where report 512 marks a cell as reference only, having too small a sample
  # to rely on, the mode's all-activities value is used instead and said so
  # below. Cycling keeps the Propensity to Cycle Tool curve: report 512's
  # cycling cells for school trips are all reference only, and a thin local
  # curve is not an improvement on a sound borrowed one.
  cycling: &cycling
    function: pct
    b0: -1.468
    b1: -0.71726
    b2: 1.988
    b3: 0.008775
    speed_kmh: 15
  purposes:
    jobs:
      label: Jobs
      group: employment
      walk: {function: negative_exponential, beta: 0.065, cutoff: rr512}   # employment, R2 0.93
      pt: {function: negative_exponential, beta: 0.036, cutoff: rr512}     # employment, R2 0.70
      bike_low_stress: *cycling
    supermarket:
      label: Supermarkets
      group: everyday
      walk: {function: negative_exponential, beta: 0.100, cutoff: rr512}   # shopping, R2 0.96
      pt: {function: negative_exponential, beta: 0.037, cutoff: rr512}     # shopping, R2 0.79
      bike_low_stress: *cycling
    gp:
      label: GPs
      group: everyday
      # "Other" in report 512 groups medical and dental with personal
      # business, social welfare and social visits.
      walk: {function: negative_exponential, beta: 0.092, cutoff: rr512}   # other, R2 0.98
      pt: {function: negative_exponential, beta: 0.036, cutoff: rr512}     # other, R2 0.78
      bike_low_stress: *cycling
    pharmacy:
      label: Pharmacies
      group: everyday
      walk: {function: negative_exponential, beta: 0.092, cutoff: rr512}   # other, R2 0.98
      pt: {function: negative_exponential, beta: 0.036, cutoff: rr512}     # other, R2 0.78
      bike_low_stress: *cycling
    early_childhood:
      label: Early childhood services
      group: education
      # Report 512 has no early childhood category. The primary school curve
      # is the nearest thing it publishes: the same daily trip with a child.
      walk: {function: negative_exponential, beta: 0.101, cutoff: rr512}
      pt: {function: negative_exponential, beta: 0.037, cutoff: rr512}
      bike_low_stress: *cycling
    primary_school:
      label: Primary schools
      group: education
      walk: {function: negative_exponential, beta: 0.101, cutoff: rr512}   # primary school, R2 0.89
      # The bus cell for primary school is marked reference only, so the bus
      # all-activities value is used instead.
      pt: {function: negative_exponential, beta: 0.037, cutoff: rr512}     # all activities, R2 0.76
      bike_low_stress: *cycling
    intermediate_school:
      label: Intermediate schools
      group: education
      walk: {function: negative_exponential, beta: 0.077, cutoff: rr512}   # intermediate school, R2 0.93
      # The bus cell for intermediate school is marked reference only.
      pt: {function: negative_exponential, beta: 0.037, cutoff: rr512}     # all activities, R2 0.76
      bike_low_stress: *cycling
    secondary_school:
      label: Secondary schools
      group: education
      walk: {function: negative_exponential, beta: 0.057, cutoff: rr512}   # high school, R2 0.84
      # The weakest fit in the whole Main Urban Area set, but the sample is
      # large enough to use.
      pt: {function: negative_exponential, beta: 0.034, cutoff: rr512}     # high school, R2 0.51
      bike_low_stress: *cycling

jobs:
  window: am_peak
  windows: [interpeak, saturday]  # also timed at these, by public transport
  resolution: 8
  thresholds: [30, 45]
  modes: [walk, bike_low_stress, bike, pt, car]

# What a journey costs, and what a traveller can reach for it.
#
# Baybus charges one fare inside a town and more between towns. Its stops
# carry rings out from Tauranga (Te Puke and Ōmokoroa 2, Katikati 3), so the
# pair fares are turned into a ring count; the fare table lists where that
# is approximate. Zones are built by scripts/build_gtfs_fare_zones.py.
#
# Fares were read from Baybus's fares pages in September 2026.
fares:
  mode: pt
  max_minutes: 45
  purposes: [jobs, supermarket, gp, pharmacy, early_childhood, primary_school, intermediate_school, secondary_school]
  budget:
    min: 0
    max: 14
    step: 0.5
    default: null
    return_trip: true
  payment_labels: {card: Bee Card}
  profiles:
    - {key: adult, label: Adult, ages: "19 to 64"}
    - {key: child, label: Child/Youth, ages: "5 to 18"}
    - {key: tertiary_student, label: Tertiary student, ages: "any, with tertiary student ID"}
    - {key: community_connect, label: Community Services Card, ages: "any"}
    - {key: accessible, label: Accessibility concession, ages: "any"}
    - {key: supergold, label: SuperGold, ages: "65 and over"}

# Errand rounds: one trip from home to two, three or four services and back,
# without a car. The legs from home come from the service runs; the legs between stops
# are routed as `links`. The pharmacy comes after the GP, where a prescription
# is written; the supermarket can come at any point. Each home tries the
# nearest few of each kind in every allowed order and keeps the quickest.
chains:
  stops: [gp, pharmacy, supermarket, library, bank_post]
  after: {pharmacy: gp}
  max_stops: 4
  candidates: 5
  leg_limits: [10, 15, 20]
  modes: [walk, pt, bike_low_stress]
  window: interpeak
  standard_minutes: 30
