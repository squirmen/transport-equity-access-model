<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TEAM · Transport Equity and Access Model</title>
  <meta name="description" content="Who in Auckland can reach everyday services and jobs without a car, who cannot, and what would change that.">
  <meta name="theme-color" content="#0c0c48">
  <link rel="icon" href="assets/team-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
  <link rel="stylesheet" href="css/team.css">
</head>
<body>
  <a class="skip-link" href="#panel">Skip to controls</a>
  <div id="map" role="region" aria-label="Map of Auckland"></div>

  <aside id="panel" class="panel" aria-label="TEAM">
    <header class="brand">
      <img class="brand-mark" src="assets/team-mark.svg" alt="" width="40" height="40">
      <div class="brand-text">
        <h1>TEAM</h1>
        <p class="tagline">Transport Equity and Access Model</p>
        <p class="mini" id="mini" aria-live="polite"></p>
      </div>
      <button class="text-button" id="about-open" type="button">About</button>
      <button class="icon-button panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" aria-label="Hide controls">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 12l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </header>

    <div id="panel-body" class="panel-body">
      <div class="field">
        <span class="field-label" id="measure-label">Measure</span>
        <div class="chips chips-compact" id="measure-picker" role="radiogroup" aria-labelledby="measure-label">
          <button class="chip" type="button" role="radio" data-measure="standards" aria-checked="true">Minutes and standards</button>
          <button class="chip" type="button" role="radio" data-measure="score" aria-checked="false">Access score</button>
        </div>
      </div>

      <div class="field" id="service-field">
        <span class="field-label" id="service-label">Getting to</span>
        <div class="chips" id="service-picker" role="radiogroup" aria-labelledby="service-label"></div>
      </div>

      <div class="field" id="standard-field">
        <div class="field-head">
          <label class="field-label" for="standard">Standard</label>
          <span class="field-value" id="standard-value"></span>
          <button class="text-button" id="standard-reset" type="button" hidden>Reset</button>
        </div>
        <input type="range" id="standard" min="5" max="60" step="5" value="20">
      </div>

      <div class="field" id="budget-field">
        <div class="field-head">
          <label class="field-label" for="budget">Fare budget</label>
          <span class="field-value" id="budget-value"></span>
          <button class="text-button" id="budget-reset" type="button" hidden>Any fare</button>
        </div>
        <input type="range" id="budget" min="0" max="20" step="0.5" value="20"
               aria-describedby="budget-note">
        <div class="ticks" id="budget-ticks" aria-hidden="true"></div>
        <p class="note" id="budget-note"></p>
      </div>

      <details class="traveller" id="traveller">
        <summary>
          <span class="field-label">Traveller</span>
          <span class="traveller-summary" id="traveller-summary"></span>
        </summary>
        <div class="traveller-body" id="traveller-body"></div>
      </details>

      <div class="tabs" role="tablist" aria-label="View" id="tabs">
        <button role="tab" type="button" id="tab-access" data-view="access" aria-selected="true" aria-controls="view">Access</button>
        <button role="tab" type="button" id="tab-people" data-view="people" aria-selected="false" aria-controls="view">Who misses out</button>
        <button role="tab" type="button" id="tab-fixes" data-view="fixes" aria-selected="false" aria-controls="view">What would help</button>
      </div>

      <section id="view" class="view" role="tabpanel" aria-live="polite"></section>
    </div>

    <footer class="panel-foot">
      <a class="lab-link" href="https://betterplaces.blogs.auckland.ac.nz" rel="noopener">
        <img src="assets/bpl-mark.svg" alt="" width="18" height="18">
        <span>Better Places Lab</span>
      </a>
      <button class="text-button share-button" id="share" type="button">Copy link</button>
      <span id="build-note" class="foot-note"></span>
    </footer>
  </aside>

  <aside id="place" class="place" hidden aria-labelledby="place-title">
    <header class="place-head">
      <div>
        <p class="eyebrow">Selected place</p>
        <h2 id="place-title"></h2>
        <p id="place-sub" class="place-sub"></p>
      </div>
      <button class="icon-button" id="place-close" type="button" aria-label="Close">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </header>
    <div id="place-body" class="place-body"></div>
  </aside>

  <div class="map-tools">
    <div class="search">
      <label class="visually-hidden" for="search">Find a place</label>
      <input id="search" type="search" placeholder="Find a suburb" autocomplete="off" role="combobox"
             aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <div class="segmented basemaps" id="basemaps" role="group" aria-label="Basemap"></div>
    <details class="layers" id="layers">
      <summary>Layers</summary>
      <div id="layer-list" class="layer-list"></div>
    </details>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="loading" class="loading" role="status">Loading Auckland…</div>

  <dialog id="about" class="about" aria-labelledby="about-title">
    <form method="dialog" class="about-close-form">
      <button class="icon-button" type="submit" aria-label="Close">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </form>
    <div id="about-body"></div>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
